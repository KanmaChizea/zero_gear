name: Deploy web to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write .env
        run: |
          printf '%s\n' \
            "BASE_URL=${{ vars.BASE_URL }}" \
            "PUBLISHABLE_KEY=${{ vars.PUBLISHABLE_KEY }}" \
            "REDIRECT_URL=${{ vars.REDIRECT_URL }}" \
            "GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}" \
            "GOOGLE_IOS_CLIENT_ID=${{ vars.GOOGLE_IOS_CLIENT_ID }}" \
            "GOOGLE_ANDROID_CLIENT_ID=${{ vars.GOOGLE_ANDROID_CLIENT_ID }}" > .env
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package build for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -R build/web/. .vercel/output/static/
          cat > .vercel/output/config.json <<'JSON'
          {
            "version": 3,
            "routes": [
              {
                "src": "/(index\\.html|flutter_bootstrap\\.js|flutter\\.js|main\\.dart\\.js|main\\.dart\\.wasm|main\\.dart\\.mjs|manifest\\.json|version\\.json)",
                "headers": { "Cache-Control": "no-cache" },
                "continue": true
              },
              { "handle": "filesystem" }
            ]
          }
          JSON
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
