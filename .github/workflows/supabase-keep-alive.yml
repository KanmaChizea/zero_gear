# Keeps the free-tier Supabase project from pausing after 7 days of inactivity.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://khoruwkonqhrkiulhoey.supabase.co
          # public publishable key (safe to commit; never put the service-role key here)
          SUPABASE_KEY: sb_publishable_F-eRObq1mtDWN62fw9zx8w_q99d48g6
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
